name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      # The registry codegen idempotency test regenerates types from the
      # Stalwart machine-readable schema at its default location
      # (~/opensource/stalwart/resources/schema/schema.json.gz). The schema
      # file itself is AGPL and never vendored, so CI fetches it from the
      # pinned upstream commit that produced
      # src/registry/generated/registrySchemaInfo.ts. When re-pinning the
      # schema, update the commit below, regenerate locally, and commit.
      - name: Fetch Stalwart schema for codegen test
        run: |
          mkdir -p ~/opensource/stalwart/resources/schema
          curl -fSL -o ~/opensource/stalwart/resources/schema/schema.json.gz \
            "https://raw.githubusercontent.com/stalwartlabs/stalwart/aa47d8ef/resources/schema/schema.json.gz"
      - name: Verify formatting
        run: bun run format:check
      - name: Build
        run: bun run build
      - name: Type-check
        run: bun run type-check
      - name: Test
        run: bun run test
